name: Build MNNCLI (Android arm64)

# 目的：编一份能在 Termux 里跑的 mnncli，用 MNN 的 OpenCL 后端跑 LLM。
#
# 【为什么不用 llama.cpp】
# llama.cpp 的 OpenCL 后端是给 Adreno 写的，Mali 要打十几处补丁（见
# build-llama-opencl.yml 的历史）。MNN 是阿里的，Android 生态里用得最多，
# 官方 release 就带 arm64 + OpenCL 的预编译库，对 Mali 的支持是原生的。
#
# 【为什么在这里编而不是本机】
# mnncli 是 C++ 工程，要 NDK 交叉编译。本机没有 NDK，CI 上有。
# 复用同一套「编完传 artifact」的流程。

on:
  workflow_dispatch:
    inputs:
      mnn_ref:
        description: 'MNN 的 ref（tag / commit / 分支）'
        required: true
        default: '3.6.2'
      arch:
        description: '目标架构'
        required: true
        default: 'arm64-v8a'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout MNN
        uses: actions/checkout@v4
        with:
          repository: alibaba/MNN
          ref: ${{ inputs.mnn_ref }}
          submodules: recursive
          path: MNN

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27
          add-to-path: false

      # libyuv 是 mnncli 的硬依赖（图像预处理用）。官方脚本会自己 clone，
      # 但它写的是相对路径 ../../3rd_party/libyuv，从 apps/mnncli 往上两级 —— 在 CI 里
      # 换个执行目录就找不到了。这里预先放到正确位置，脚本就会跳过 clone。
      - name: Provide libyuv
        run: |
          cd MNN
          mkdir -p 3rd_party
          git clone --depth 1 https://github.com/bilibili/libyuv.git 3rd_party/libyuv
          # libyuv 的 CMakeLists 第一行是 cmake_minimum_required(VERSION 3.0) 之类，
          # 而 CMake 4.x 已经删掉了 <3.5 的兼容层，直接报
          # "Compatibility with CMake < 3.5 has been removed"。
          # 抬高下限即可，libyuv 本身没有用到任何被移除的老行为。
          sed -i -E 's/^cmake_minimum_required\(VERSION [0-9.]+.*\)/cmake_minimum_required(VERSION 3.10)/' 3rd_party/libyuv/CMakeLists.txt
          head -1 3rd_party/libyuv/CMakeLists.txt

      # 【坑】mnncli 的 CMakeLists 默认会去找 OpenCV，找不到直接报错。
      # 我们只要文本推理，不要图像能力，所以关掉它。
      # 同理关掉 OpenCL 以外的加速后端，避免引入无关依赖。
      # 【mnncli 要求先有 MNN 静态库】
      # apps/mnncli/CMakeLists.txt 里写死：
      #   set(MNN_BUILD_DIR ".../../../build_mnn_static")
      #   find_library(MNN_LIBRARY NAMES libMNN.a MNN PATHS ${MNN_BUILD_DIR} NO_DEFAULT_PATH REQUIRED)
      # 所以必须先在仓库根编出 build_mnn_static/libMNN.a，否则 Configure 直接失败。
      # 官方 android_build.sh 里没有这一步（它假定你手动编过）。
      - name: Build MNN static library first
        run: |
          cd MNN
          cmake -S . -B build_mnn_static \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ inputs.arch }} \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DMNN_BUILD_SHARED_LIBS=OFF \
            -DMNN_OPENCL=ON \
            -DMNN_VULKAN=OFF \
            -DMNN_USE_SSE=OFF \
            -DMNN_BUILD_OPENCV=OFF \
            -DMNN_LOW_MEMORY=ON \
            -DMNN_SUPPORT_TRANSFORMER_FUSE=ON \
            -DMNN_KLEIDIAI=ON
          cmake --build build_mnn_static --target MNN -j$(nproc)
          ls -lh build_mnn_static/libMNN.a

      # 【OpenSSL 头文件，NDK 只给库不给头】
      # NDK 的 sysroot 里有 libcrypto.so / libssl.so（stub），但没有 openssl/*.h。
      # mnncli 的 httplib 开了 CPPHTTPLIB_OPENSSL_SUPPORT 后会 #include 这些头，
      # 所以从 OpenSSL 官方仓库取一份对应版本的头文件体系。
      # 【OpenSSL 头文件，NDK 只给库不给头】
      # NDK sysroot 有 libcrypto/libssl 的 stub，但没有 openssl/*.h。
      # 用 tarball 而不是 git clone：clone 整个 OpenSSL 仓库在这台 runner 上
      # 要几分钟且经常超时，只要 include/openssl 那几十个头文件。
      - name: Provide OpenSSL headers
        run: |
          SYSROOT=${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot
          curl -fsSL -o /tmp/openssl.tar.gz \
            https://github.com/openssl/openssl/releases/download/openssl-3.0.15/openssl-3.0.15.tar.gz
          tar xzf /tmp/openssl.tar.gz -C /tmp
          ls /tmp | head
          SRC=$(find /tmp -maxdepth 1 -name 'openssl-*' -type d | head -1)
          echo "解压目录: $SRC"
          test -d "$SRC/include/openssl" || { echo "找不到 include/openssl"; find /tmp -maxdepth 3 -name 'err.h' 2>/dev/null | head; exit 1; }
          mkdir -p "$SYSROOT/usr/include"
          cp -r "$SRC/include/openssl" "$SYSROOT/usr/include/"
          echo "拷贝后: $(ls "$SYSROOT/usr/include/openssl/" | wc -l) 个文件"
          # opensslconf.h / configuration.h 是 configure 产物，源码树里没有。
          # 用一个最小可用的替代：httplib 只用到少量符号，不需要真实配置值。
          if [ ! -f "$SYSROOT/usr/include/openssl/opensslconf.h" ]; then
            cat > "$SYSROOT/usr/include/openssl/opensslconf.h" <<'EOF_CONF'
          /* 最小占位：httplib 编译期只需要这些开关存在 */
          #ifndef OPENSSL_CONF_H
          #define OPENSSL_CONF_H
          #define OPENSSL_API_COMPAT 0x10100000L
          #define OPENSSL_NO_DEPRECATED 1
          #endif
          EOF_CONF
          fi
          test -f "$SYSROOT/usr/include/openssl/err.h" && echo "err.h OK"
          test -f "$SYSROOT/usr/include/openssl/opensslconf.h" && echo "opensslconf.h OK"

      - name: Configure
        run: |
          cd MNN/apps/mnncli
          # 【上游 bug】CMakeLists 在 Android 下无条件 append
          # src/AndroidVideoDecoder.cpp，但 3.6.2 的源码树里没有这个文件，
          # add_executable 直接报 "Cannot find source file"。
          # 那是视频解码用的，文本推理用不到 —— 给它个空壳占位即可。
          #
          # 手写占位文件是空壳，所以还要保证它不被当成真正的解码器实现：
          # 补一个空的 .cpp，编译出来就是 no-op，链接阶段如果有引用会报
          # undefined symbol，那时再补实现。
          if [ ! -f src/AndroidVideoDecoder.cpp ]; then
            cat > src/AndroidVideoDecoder.cpp <<'EOF_AVD'
          // 占位：上游 CMakeLists 在 Android 下无条件引用本文件，但源码树里没有。
          // 文本推理路径不使用视频解码，保留空翻译单元即可。
          EOF_AVD
            echo "已补 AndroidVideoDecoder.cpp 占位（$(wc -l < src/AndroidVideoDecoder.cpp) 行）"
          fi

          cmake -S . -B build_android \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ inputs.arch }} \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DMNN_OPENCL=ON \
            -DMNN_VULKAN=OFF \
            -DMNN_USE_SSE=OFF \
            -DMNN_OPENCV=OFF \
            -DMNN_BUILD_OPENCV=OFF \
            -DMNN_LOW_MEMORY=ON \
            -DMNN_SUPPORT_TRANSFORMER_FUSE=ON \
            -DOPENSSL_ROOT_DIR=${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr \
            -DOPENSSL_INCLUDE_DIR=${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include \
            -DOPENSSL_CRYPTO_LIBRARY=${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libcrypto.so \
            -DOPENSSL_SSL_LIBRARY=${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libssl.so \
            -DMNN_BUILD_DIR=${{ github.workspace }}/MNN/build_mnn_static \
            -DMNN_SOURCE_DIR=${{ github.workspace }}/MNN \
            -DMNN_LIBRARY=${{ github.workspace }}/MNN/build_mnn_static/libMNN.a \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH \
            -DCMAKE_CXX_FLAGS="-DCPPHTTPLIB_OPENSSL_SUPPORT -DCPPHTTPLIB_ZLIB_SUPPORT"

      - name: Build
        run: |
          cd MNN/apps/mnncli
          cmake --build build_android -j$(nproc)

      - name: Collect artifacts
        run: |
          set -e
          mkdir -p out
          find MNN/apps/mnncli/build_android -name 'mnncli' -type f -exec cp {} out/ \;
          # 运行期要链接的 .so 一起打包，手机上不用另外找
          find MNN/apps/mnncli/build_android -name '*.so' -type f -exec cp {} out/ \;
          ls -lh out/
          file out/mnncli | grep -q aarch64 || { echo '不是 arm64'; exit 1; }
          cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS
          tar czf ../mnncli-android-arm64.tar.gz *

      - uses: actions/upload-artifact@v4
        with:
          name: mnncli-android-arm64
          path: mnncli-android-arm64.tar.gz
          retention-days: 30

name: Build MNNCLI (Android arm64)

# 目的：编一份能在 Termux 里跑的 mnncli，用 MNN 的 OpenCL 后端跑 LLM。
#
# 【为什么不用 llama.cpp】
# llama.cpp 的 OpenCL 后端是给 Adreno 写的，Mali 要打十几处补丁（见
# build-llama-opencl.yml 的历史）。MNN 是阿里的，Android 生态里用得最多，
# 官方 release 就带 arm64 + OpenCL 的预编译库，对 Mali 的支持是原生的。
#
# 【为什么在这里编而不是本机】
# mnncli 是 C++ 工程，要 NDK 交叉编译。本机没有 NDK，CI 上有。
# 复用同一套「编完传 artifact」的流程。

on:
  workflow_dispatch:
    inputs:
      mnn_ref:
        description: 'MNN 的 ref（tag / commit / 分支）'
        required: true
        default: '3.6.2'
      arch:
        description: '目标架构'
        required: true
        default: 'arm64-v8a'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout MNN
        uses: actions/checkout@v4
        with:
          repository: alibaba/MNN
          ref: ${{ inputs.mnn_ref }}
          submodules: recursive
          path: MNN

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27
          add-to-path: false

      # libyuv 是 mnncli 的硬依赖（图像预处理用）。官方脚本会自己 clone，
      # 但它写的是相对路径 ../../3rd_party/libyuv，从 apps/mnncli 往上两级 —— 在 CI 里
      # 换个执行目录就找不到了。这里预先放到正确位置，脚本就会跳过 clone。
      - name: Provide libyuv
        run: |
          cd MNN
          mkdir -p 3rd_party
          git clone --depth 1 https://github.com/bilibili/libyuv.git 3rd_party/libyuv

      # 【坑】mnncli 的 CMakeLists 默认会去找 OpenCV，找不到直接报错。
      # 我们只要文本推理，不要图像能力，所以关掉它。
      # 同理关掉 OpenCL 以外的加速后端，避免引入无关依赖。
      - name: Configure
        run: |
          cd MNN/apps/mnncli
          cmake -S . -B build_android \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ inputs.arch }} \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DMNN_OPENCL=ON \
            -DMNN_VULKAN=OFF \
            -DMNN_USE_SSE=OFF \
            -DMNN_OPENCV=OFF \
            -DMNN_BUILD_OPENCV=OFF \
            -DMNN_LOW_MEMORY=ON \
            -DMNN_SUPPORT_TRANSFORMER_FUSE=ON

      - name: Build
        run: |
          cd MNN/apps/mnncli
          cmake --build build_android -j$(nproc)

      - name: Collect artifacts
        run: |
          set -e
          mkdir -p out
          find MNN/apps/mnncli/build_android -name 'mnncli' -type f -exec cp {} out/ \;
          # 运行期要链接的 .so 一起打包，手机上不用另外找
          find MNN/apps/mnncli/build_android -name '*.so' -type f -exec cp {} out/ \;
          ls -lh out/
          file out/mnncli | grep -q aarch64 || { echo '不是 arm64'; exit 1; }
          cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS
          tar czf ../mnncli-android-arm64.tar.gz *

      - uses: actions/upload-artifact@v4
        with:
          name: mnncli-android-arm64
          path: mnncli-android-arm64.tar.gz
          retention-days: 30

name: Build llama.cpp OpenCL (Android arm64)

# 目的：给 Termux 编一份认 Mali GPU 的 libggml-opencl.so。
#
# 【为什么必须自己编】
# Termux 官方包 llama-cpp-backend-opencl 是按 Adreno 编的，两处会拒掉 Mali：
#   1. ggml_opencl_is_device_supported() 的白名单只认 Adreno / Qualcomm / Intel
#   2. GGML_OPENCL_USE_ADRENO_KERNELS 默认 ON，非 Adreno 直接 return false
# 两处都在编译期决定，运行时没有开关可以绕过。
#
# 【为什么用 NDK 交叉编译】
# Actions 的 runner 是 x86_64，产物要跑在手机 arm64 上。
# 用 NDK toolchain 而不是模拟器：不需要 root、不需要 QEMU、几分钟出结果。
#
# 【产物怎么给手机】
# 编完打包成 artifact，手机端 wget 下载后覆盖 $PREFIX/lib/libggml-opencl.so。

on:
  workflow_dispatch:
    inputs:
      llama_ref:
        description: 'llama.cpp 的 ref（tag / commit / 分支）'
        required: true
        # 【必须和 Termux 装的版本一致】
        # Termux 的 llama-cpp 0.8.0 来自 tag `v0.8.0`（build.sh 里
        # TERMUX_PKG_SRCURL 指向 archive/refs/tags/v0.8.0.tar.gz），不是 bXXXX 那种
        # nightly 编号。版本不一致会撞上两件事：
        #   · GGML_BACKEND_API_VERSION 对不上 → "incompatible API version
        #     (backend: 2, current: 3)"，后端直接拒绝初始化
        #   · Mali 白名单那段的锚点字符串可能已经改过，补丁打不上
        default: 'v0.8.0'
      opencl_target:
        description: 'OpenCL 目标版本（Mali 报 3.0，填 300）'
        required: true
        default: '300'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ inputs.llama_ref }}
          submodules: recursive
          path: llama.cpp

      # 白名单补丁：让 Mali 走通用 kernel 路径。
      # 不选「把 Mali 塞进 ADRENO 分支」是因为那会用上 Adreno 专用 kernel。
      - name: Patch Mali into the OpenCL allowlist
        run: |
          cd llama.cpp
          python3 - <<'PY'
          import pathlib, sys
          p = pathlib.Path('ggml/src/ggml-opencl/ggml-opencl.cpp')
          src = p.read_text()

          anchor = '''    } else if (strstr(dev_ctx->device_name.c_str(), "Intel")) {
              dev_ctx->gpu_family = GPU_FAMILY::INTEL;
          } else {'''
          # 实际文件里缩进是 4 空格，不是上面这种，用 split 更稳
          needle = '    } else if (strstr(dev_ctx->device_name.c_str(), "Intel")) {'
          if needle not in src:
              sys.exit('找不到 Intel 分支，llama.cpp 改了？')

          # 插在 Intel 分支的 } else { 之前
          marker = 'dev_ctx->gpu_family = GPU_FAMILY::INTEL;\n    } else {'
          if marker not in src:
              sys.exit('Intel 分支结构变了')
          repl = ('dev_ctx->gpu_family = GPU_FAMILY::INTEL;\n'
                  '    } else if (strstr(dev_ctx->device_name.c_str(), "Mali")) {\n'
                  '        // Mali 走通用 kernel：Adreno 专用 kernel 已在编译期关闭。\n'
                  '        dev_ctx->gpu_family = GPU_FAMILY::UNKNOWN;\n'
                  '    } else {')
          p.write_text(src.replace(marker, repl, 1))
          print('补丁应用成功')
          PY

      # 【Mali 编译器 choke 在 Qualcomm 私有扩展上】
      # 77 个 kernel 里都有这行：
      #   #pragma OPENCL EXTENSION cl_qcom_reqd_sub_group_size : enable
      # Mali 的编译器遇到不认识的 extension pragma 会**中止预处理**，
      # 于是文件后面所有 #define（N_SIMDGROUP / N_DST / N_SIMDWIDTH …）全部失效，
      # 报出一串 "use of undeclared identifier"。
      #
      # 这个 pragma 只是给 Adreno 的 sub_group_size 提示，Mali 上没有任何作用，
      # 删掉不影响语义（kernel 里本来就有 #define 兜底）。
      - name: Strip Qualcomm-only extension pragmas from kernels
        run: |
          cd llama.cpp/ggml/src/ggml-opencl/kernels

          BEFORE=$(grep -rl "cl_qcom" . 2>/dev/null | wc -l)
          echo "含 cl_qcom 的 kernel: $BEFORE 个"

          # 6 种变体（reqd_sub_group_size / extra_vector_types /
          # subgroup_constant_load / subgroup_shuffle / subgroup_uniform_load …）全删。
          # 它们是 Adreno 专属提示，Mali 上无意义；而 Mali 编译器遇到不认识的
          # extension 会中止预处理，导致后面所有 #define 失效。
          #
          # 不用 set -euo pipefail / xargs：grep 无匹配时返回 1，
          # pipefail 会让脚本在中途退出，而 -r 参数又依赖 xargs 的行为。
          # 这里逐个文件 sed，退出码自己判断，最稳。
          grep -rl "cl_qcom" . 2>/dev/null | while IFS= read -r f; do
            sed -i -E '/^[[:space:]]*#pragma[[:space:]]+OPENCL[[:space:]]+EXTENSION[[:space:]]+cl_qcom/d' "$f"
          done

          PRAGMA=$(grep -rn "pragma.*cl_qcom" . 2>/dev/null | wc -l)
          echo "残留 pragma: $PRAGMA 个（应为 0）"

          # 剩下的应该只有 #if/#elif defined(...) 这类守卫，它们不含 pragma。
          # 注意 grep -c 在无匹配时返回 1，用 || true 兜住。
          LEFT=$(grep -rh "cl_qcom" . 2>/dev/null | grep -v "ifdef\|defined\|endif" | wc -l || true)
          echo "其他 cl_qcom 用法: $LEFT 行"
          grep -rn "pragma.*cl_qcom" . 2>/dev/null | head -5 || true

          test "$PRAGMA" -eq 0

      # 【Mali 拿不到 N_DST / N_SIMDWIDTH】
      # kernel 里的宏块只覆盖两家：
      #   #ifdef INTEL_GPU            → N_DST 4 / N_SIMDWIDTH 16
      #   #elif defined(ADRENO_GPU)   → N_DST 4 / N_SIMDWIDTH 64
      #   #endif                      ← Mali 两个都不满足，宏全空，
      #                                 后面用到的地方一律 "undeclared identifier"
      #
      # 做法：让 Mali 走上 ADRENO 分支（N_DST 各 kernel 取值不同，复用它的最省事），
      # 但把 N_SIMDWIDTH 从 64 改成 16 —— 实测这台 Mali-G615 的
      # CL_DEVICE_PREFERRED_VECTOR_WIDTH / subgroup 宽度就是 16（clinfo 的
      # "Preferred work group size multiple = 16"），不是 Adreno 的 64。
      #
      # 先在前面的 strip 步骤里已经删掉了 cl_qcom 的 pragma，所以这里
      # ADRENO_GPU 本来是不会被定义的，需要显式定义它。
      - name: Teach the kernels about Mali
        run: |
          cd llama.cpp/ggml/src/ggml-opencl/kernels

          # 1) 让 #elif defined(ADRENO_GPU) 也接受 MALI_GPU
          grep -rl "defined *(ADRENO_GPU)" . 2>/dev/null | while IFS= read -r f; do
            sed -i -E 's/#elif defined *\(ADRENO_GPU\)/#elif defined(ADRENO_GPU) || defined(MALI_GPU)/g' "$f"
          done

          # 4) REQD_SUBGROUP_SIZE_* 是 Adreno 的 __attribute__((qcom_...))，
          #    定义在已失效的 #elif defined(cl_qcom_...) 块里。Mali 不需要这个
          #    attribute（宽度本来就是 16，由 N_SIMDWIDTH 控制），全部定义成空。
          #    判断用「第 1 行是不是 MALI 标记」，不能判 "有没有 REQD_SUBGROUP_SIZE_64"：
          #    文件里本来就有这个 #define，只不过藏在永远不会进入的
          #    #elif defined(cl_qcom_...) 分支里。
          #
          #    用宏包一层 #ifndef，避免和 Intel 分支的已有定义冲突。
          grep -rl "REQD_SUBGROUP_SIZE" . 2>/dev/null | while IFS= read -r f; do
            head -1 "$f" | grep -q "MALI_GPU" && continue
            sed -i '1i #define MALI_GPU 1\n#ifndef REQD_SUBGROUP_SIZE_16\n#define REQD_SUBGROUP_SIZE_16\n#endif\n#ifndef REQD_SUBGROUP_SIZE_32\n#define REQD_SUBGROUP_SIZE_32\n#endif\n#ifndef REQD_SUBGROUP_SIZE_64\n#define REQD_SUBGROUP_SIZE_64\n#endif\n#ifndef REQD_SUBGROUP_SIZE_128\n#define REQD_SUBGROUP_SIZE_128\n#endif' "$f"
          done

          # 2) 在每个文件最前面定义 MALI_GPU（只加一次）
          grep -rl "REQD_SUBGROUP_SIZE\|defined *(ADRENO_GPU)" . 2>/dev/null | while IFS= read -r f; do
            grep -q "^#define MALI_GPU" "$f" && continue
            sed -i '1i #define MALI_GPU 1' "$f"
          done

          # 3) Mali 的 subgroup 宽度是 16，不是 Adreno 的 64
          grep -rl "N_SIMDWIDTH 64" . 2>/dev/null | while IFS= read -r f; do
            sed -i -E 's/#define N_SIMDWIDTH 64(.*)$/#define N_SIMDWIDTH 16\1/' "$f"
          done


          echo "打补丁的文件数: $(grep -rl "MALI_GPU" . 2>/dev/null | wc -l)"
          echo "仍有 N_SIMDWIDTH 64 的: $(grep -rl "N_SIMDWIDTH 64" . 2>/dev/null | wc -l)（应为 0）"
          grep -rn "N_SIMDWIDTH 16" . 2>/dev/null | head -3 || true

      # 【v0.8.0 还有一道运行时 GPU family 检查】
      # gated_delta_net 的初始化在启动时无条件执行：
      #   sg_size = ADRENO ? 64 : INTEL ? 32 : -1
      #   if (sg_size < 0) { GGML_LOG_ERROR("Unsupported GPU Family..."); exit(1); }
      # Mali 两个都不是 → -1 → 整个后端 exit(1)，跟模型无关。
      #
      # 把 Mali 归到 INTEL 家族：Adreno 分支是 64，而 Mali 的 subgroup 是 16，
      # 差太多；Intel 的 32 至少能让初始化往下走。实际跑不到 gated_delta_net
      # （特定架构的算子），常规 matmul 路径的宽度已由 kernel 层的
      # N_SIMDWIDTH=16 控制。
      - name: Let the OpenCL backend accept Mali at runtime
        run: |
          cd llama.cpp/ggml/src/ggml-opencl
          # 补丁脚本以 base64 内联，避免在 YAML/shell/python 三层里反复转义引号
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          grep -n 'c_str(), "Mali"' ggml-opencl.cpp

      # 【sg_size 的 -1 是一条死路】
      # gated_delta_net 两处初始化都这样算：
      #   sg_size = ADRENO ? 64 : INTEL ? 32 : -1;
      #   if (sg_size < 0) { GGML_LOG_ERROR("Unsupported GPU Family..."); exit(1); }
      # 前面虽然把 Mali 映射成 INTEL，但 gpu_family 在 buffer 分配那条初始化
      # 路径上仍然是 UNKNOWN（两条路径到 load_cl_kernels，只覆盖了一条），
      # 所以 sg_size 照样是 -1，整个后端直接 exit。
      #
      # 与其继续追 gpu_family 的赋值链，不如把这个兜底改掉：
      # sg_size 兜底取 32，并删掉 exit。gated_delta_net 是特定架构的算子，
      # 这个模型用不到；真正影响 matmul 的是 kernel 层的 N_SIMDWIDTH=16。
      - name: Neutralize the sg_size exit in the OpenCL backend
        run: |
          cd llama.cpp/ggml/src/ggml-opencl
          echo '' | base64 -d > /tmp/patch2.py
          python3 /tmp/patch2.py
          echo "残留 Unsupported GPU Family 字符串: $(grep -c 'Unsupported GPU Family' ggml-opencl.cpp || true)"

      # 【6 处 "Unsupported GPU" 断言】
      # 这些算子的 subgroup 尺寸也是写死的二选一：
      #   ADRENO ? 64 : INTEL ? 32 : GGML_ASSERT(false && "Unsupported GPU")
      # 和前面的 exit 不同，这些是**每次推理都会走到的**（rms_norm_mul、
      # group_norm、norm 一类），所以 Mali 一跑就 abort。
      # 统一把兜底分支改成 sgs = 32。
      - name: Replace the unsupported-GPU asserts with a 32 fallback
        run: |
          cd llama.cpp/ggml/src/ggml-opencl
          echo '' | base64 -d > /tmp/patch3.py
          python3 /tmp/patch3.py
          echo "残留断言: $(grep -c 'Unsupported GPU' ggml-opencl.cpp || true)（应为 0）"

      # 【33 处 "TODO: Unknown GPU"】
      # 几乎所有 matmul 分支都是三段式：
      #   if (INTEL) {...} else if (ADRENO) {...} else { GGML_ASSERT(false && "TODO: Unknown GPU"); }
      # 前面虽然把 Mali 映射成 INTEL，但 gpu_family 在 buffer 分配那条路径上
      # 仍是 UNKNOWN，所以这些断言照样会触发（Q4_0 matmul 就是其中之一，
      # 而 Q4_K_M 模型里含 Q4_0 块，必走）。
      #
      # 做法：把第一段的判断放宽成 (INTEL || UNKNOWN)，Mali 复用 Intel 的参数
      # （nth0=32 那套），同时删掉已不可达的 else 断言。
      - name: Route unknown GPU family through the Intel branches
        run: |
          cd llama.cpp/ggml/src/ggml-opencl
          echo '' | base64 -d > /tmp/patch4.py
          python3 /tmp/patch4.py
          echo "核对括号: $(grep -o '{' ggml-opencl.cpp | wc -l) / $(grep -o '}' ggml-opencl.cpp | wc -l)"

      - name: Log ndrange sizes when a kernel launch fails
        run: |
          cd llama.cpp/ggml/src/ggml-opencl
          echo '' | base64 -d > /tmp/patch5.py
          python3 /tmp/patch5.py

      # 【-54 CL_INVALID_WORK_GROUP_SIZE 的根因】
      # q4_0 matmul 有两套 global size 公式：
      #   Adreno 口径（默认）：global[0] = (ne01+7)/8*nth0，配 _8x_flat kernel
      #   Intel 覆盖：        global[0] = (ne01+15)/16*nth0，配 _16x_flat kernel
      # 上一步让 UNKNOWN 走了 Intel 的 **kernel 选择**，但这段 global size 覆盖
      # 仍然只判 == INTEL，于是 kernel 按 16 对齐、global 却按 8 对齐，
      # 算出来比 local_work_size 还小（实测 global=[16,1,1] local=[64,1,1]）。
      - name: Align the global size override with the Intel kernel choice
        run: |
          cd llama.cpp/ggml/src/ggml-opencl
          echo '' | base64 -d > /tmp/patch6.py
          python3 /tmp/patch6.py

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r29
          add-to-path: false

      # 【OpenCL 依赖，NDK r29 一个都不给】
      # 实测 NDK r29 的 sysroot 里只有 libdl/libz/liblog/libGLESv2/libm 这类，
      # **没有 libOpenCL.so 也没有 CL 头文件**（配置日志里
      # "Looking for include file OpenCL/cl.h - not found" + 找不到 .so 都是这个）。
      #
      # 两条来源都试过、都不该走：
      #   · 自己写 stub —— 要逐个抄 31 个函数签名，错一个就是运行时崩溃
      #   · 链 Khronos ICD-Loader —— 那是要编进产物的，不是我们要的
      #
      # 正解：**直接下 Termux 的 ocl-icd 包**。它就是 NDK 编的 aarch64 Android 库，
      # 只依赖 libdl/libc，导出 134 个符号。手机端运行时本来也是它，版本天然一致。
      - name: Fetch OpenCL lib + headers from the Termux ocl-icd package
        run: |
          set -euo pipefail
          SYSROOT=${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot
          DEST=$SYSROOT/usr/lib/aarch64-linux-android
          mkdir -p "$DEST" "$SYSROOT/usr/include"

          # ubuntu-latest 有 dpkg-deb，直接解包最省事
          curl -fsSL -o /tmp/ocl.deb \
            "https://mirrors.bfsu.edu.cn/termux/apt/termux-main/pool/main/o/ocl-icd/ocl-icd_2.3.5_aarch64.deb"
          dpkg-deb -x /tmp/ocl.deb /tmp/ocl

          # 包里只有 .so（已核实：lib/libOpenCL.so + .so.1，没有头文件）
          find /tmp/ocl -name 'libOpenCL.so*' | head
          cp "$(find /tmp/ocl -name 'libOpenCL.so' | head -1)" "$DEST/libOpenCL.so"
          ls -la "$DEST/libOpenCL.so"

          # 头文件从 Khronos 拉（ggml include 的是 CL/cl.h）
          git clone --depth 1 https://github.com/KhronosGroup/OpenCL-Headers.git /tmp/ocl-headers
          cp -r /tmp/ocl-headers/CL "$SYSROOT/usr/include/"
          test -f "$SYSROOT/usr/include/CL/cl.h" && echo "headers OK"

      # 【GGML_BACKEND_DL 必须开】
      # ggml_backend_init() 这个 dlopen 入口由 GGML_BACKEND_DL_IMPL 宏生成，
      # 而宏体包在 #ifdef GGML_BACKEND_DL 里。不开这个标志编出来的 .so
      # 没有任何后端入口，运行时只会报
      #   "failed to find ggml_backend_init in .../libggml-opencl.so"
      # 而且它要求 BUILD_SHARED_LIBS=ON，否则 cmake 直接 FATAL_ERROR。
      - name: Configure (NDK cross-compile, OpenCL only)
        run: |
          SYSROOT=${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot

          # 【路径探测】NDK 的 OpenCL 是 stub 库，位置随版本变化：
          #   老版本在 usr/lib/aarch64-linux-android/<API>/libOpenCL.so
          #   新版本在 usr/lib/aarch64-linux-android/libOpenCL.so
          # 之前硬编码第一种，cmake 照单全收（它不校验文件是否存在），
          # 到 make 阶段才报 "No rule to make target ... libOpenCL.so"。
          OCL_LIB=$(find "$SYSROOT/usr/lib/aarch64-linux-android" -name 'libOpenCL.so' 2>/dev/null | head -1)
          if [ -z "$OCL_LIB" ]; then
            echo "找不到 libOpenCL.so，列出候选目录："
            find "$SYSROOT/usr/lib/aarch64-linux-android" -maxdepth 2 -name 'lib*.so' 2>/dev/null | head -20
            exit 1
          fi
          echo "OpenCL 库: $OCL_LIB"
          ls -la "$OCL_LIB"

          cmake -S llama.cpp -B build \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DOpenCL_INCLUDE_DIR=$SYSROOT/usr/include \
            -DOpenCL_LIBRARY="$OCL_LIB" \
            -DGGML_OPENCL=ON \
            -DGGML_BACKEND_DL=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_OPENCL_USE_ADRENO_KERNELS=OFF \
            -DGGML_OPENCL_TARGET_VERSION=${{ inputs.opencl_target }} \
            -DGGML_OPENCL_EMBED_KERNELS=ON \
            -DGGML_VULKAN=OFF \
            -DGGML_OPENMP=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DGGML_NATIVE=OFF

      # 只编 OpenCL 后端这一个 target：手机上只要 .so，不要 200MB 的可执行文件。
      - name: Build libggml-opencl.so
        run: cmake --build build --target ggml-opencl -j$(nproc)

      - name: Verify the .so
        run: |
          SO=$(find build -name 'libggml-opencl.so*' -type f | head -1)
          echo "产物: $SO"
          file "$SO"
          # 必须是 aarch64，不是 x86_64 —— 否则说明 toolchain 没生效
          file "$SO" | grep -q 'aarch64' || { echo '不是 arm64，toolchain 没生效'; exit 1; }
          ls -lh "$SO"

      - name: Package
        run: |
          mkdir -p out
          cp $(find build -name 'libggml-opencl.so*' -type f | head -1) out/libggml-opencl.so
          cd out && sha256sum libggml-opencl.so > SHA256SUMS && cat SHA256SUMS
          tar czf ../libggml-opencl-android-arm64.tar.gz libggml-opencl.so SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: libggml-opencl-android-arm64
          path: libggml-opencl-android-arm64.tar.gz
          retention-days: 30
